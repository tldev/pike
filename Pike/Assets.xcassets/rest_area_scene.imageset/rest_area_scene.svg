<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 540" width="1020" height="540">
  <!-- Rest area building -->
  <g fill="none" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <!-- Building body -->
    <rect x="380" y="260" width="260" height="140" rx="2"/>
    <!-- Pitched roof -->
    <polygon points="360,260 510,180 660,260"/>
    <!-- Door -->
    <rect x="480" y="330" width="60" height="70"/>
    <!-- Door handle -->
    <circle cx="530" cy="368" r="4"/>
    <!-- Windows -->
    <rect x="400" y="290" width="50" height="40" rx="2"/>
    <rect x="570" y="290" width="50" height="40" rx="2"/>
    <!-- Flag pole on roof -->
    <line x1="510" y1="180" x2="510" y2="130"/>
    <!-- Flag -->
    <polygon points="510,130 550,140 510,150" fill="white" opacity="0.6"/>

    <!-- Left tree -->
    <line x1="220" y1="400" x2="220" y2="280"/>
    <ellipse cx="220" cy="240" rx="80" ry="70"/>
    <ellipse cx="180" cy="260" rx="50" ry="45"/>
    <ellipse cx="260" cy="260" rx="50" ry="45"/>

    <!-- Right tree -->
    <line x1="800" y1="400" x2="800" y2="280"/>
    <ellipse cx="800" cy="240" rx="80" ry="70"/>
    <ellipse cx="760" cy="260" rx="50" ry="45"/>
    <ellipse cx="840" cy="260" rx="50" ry="45"/>

    <!-- Left picnic table -->
    <rect x="130" y="370" width="60" height="6" rx="1"/>
    <line x1="140" y1="376" x2="135" y2="400"/>
    <line x1="180" y1="376" x2="185" y2="400"/>
    <rect x="125" y="384" width="30" height="4" rx="1"/>
    <rect x="165" y="384" width="30" height="4" rx="1"/>

    <!-- Right picnic table -->
    <rect x="830" y="370" width="60" height="6" rx="1"/>
    <line x1="840" y1="376" x2="835" y2="400"/>
    <line x1="880" y1="376" x2="885" y2="400"/>
    <rect x="825" y="384" width="30" height="4" rx="1"/>
    <rect x="865" y="384" width="30" height="4" rx="1"/>

    <!-- Curved walkway -->
    <path d="M 480,400 Q 460,430 420,450 Q 350,480 280,480 L 100,480"/>
    <path d="M 540,400 Q 560,430 600,450 Q 670,480 740,480 L 920,480"/>

    <!-- Ground line -->
    <line x1="40" y1="400" x2="980" y2="400" stroke-width="2"/>

    <!-- Parking area lines (foreground) -->
    <line x1="200" y1="500" x2="200" y2="530" stroke-width="2"/>
    <line x1="280" y1="500" x2="280" y2="530" stroke-width="2"/>
    <line x1="360" y1="500" x2="360" y2="530" stroke-width="2"/>
    <line x1="660" y1="500" x2="660" y2="530" stroke-width="2"/>
    <line x1="740" y1="500" x2="740" y2="530" stroke-width="2"/>
    <line x1="820" y1="500" x2="820" y2="530" stroke-width="2"/>
    <line x1="140" y1="500" x2="880" y2="500" stroke-width="2"/>

    <!-- Rolling hills (background) -->
    <path d="M 0,260 Q 100,220 200,240 Q 300,260 400,250" stroke-width="1.5" opacity="0.4"/>
    <path d="M 620,250 Q 720,230 820,245 Q 920,260 1020,240" stroke-width="1.5" opacity="0.4"/>
  </g>
</svg>
